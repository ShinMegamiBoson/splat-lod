name: Standalone splat LOD
on:
  push:
    branches: [codex/standalone-splat-lod]
  pull_request:
    paths: ['src/**', 'scripts/splat-lod/**', 'packages/splat-lod/**', 'test/splat-lod/**', 'examples/src/examples/splat-lod/**', '.github/workflows/splat-lod.yml', 'package-lock.json', 'eslint.config.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            src
            utils
            scripts/splat-lod
            packages/splat-lod
            test/splat-lod
            examples/src/examples/splat-lod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: packages/splat-lod/benchmark
      - run: python -m pip install -r scripts/splat-lod/requirements.txt
      - run: npm --prefix packages/splat-lod run build
      - run: npm run build
        working-directory: packages/splat-lod/benchmark
      - run: npm --prefix packages/splat-lod run lint
      - run: npm --prefix packages/splat-lod test
      - run: npm --prefix packages/splat-lod run test:types
      - run: python test/splat-lod/preprocessing_test.py
      - run: npm pack
        working-directory: packages/splat-lod
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: splat-lod-package
          path: packages/splat-lod/*.tgz
